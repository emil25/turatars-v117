name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: build/package-lock.json

      - name: Install build dependencies
        working-directory: build
        run: npm ci

      - name: Rebundle application source
        run: node tools/rebundle.mjs

      - name: Typecheck source
        working-directory: build
        run: npm run typecheck

      - name: Run build-output tests
        working-directory: build
        run: npm test

      - name: Build production site
        working-directory: build
        env:
          VITE_TT_SUPABASE_ENABLED: "true"
          VITE_SUPABASE_URL: https://reezefgcbdrcnuhcktma.supabase.co
        run: |
          npm run build
          bundle=$(find dist/assets -maxdepth 1 -name 'index-*.js' -print -quit)
          test -n "$bundle"
          grep -q 'reezefgcbdrcnuhcktma\.supabase\.co' "$bundle"
          grep -q 'sb_publishable_' "$bundle"
          grep -q 'cloudAuthEnabled' "$bundle"
          grep -q 'authSignup' "$bundle"
          grep -q 'authLogin' "$bundle"

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
