name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble production site
        shell: bash
        run: |
          mkdir -p _site/assets _site/icons
          cp index.html manifest.webmanifest sw.js .nojekyll _site/
          cp assets/*.css _site/assets/
          cp icons/* _site/icons/
          cat .deploy/index-js.part* > _site/assets/index-hK_TCQP8.js
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
